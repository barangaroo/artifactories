services:
  - type: web
    name: artifactories
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
      - key: REGISTRATION_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://artifactories.com
      - key: POW_DIFFICULTY_BITS
        value: "22"
      - key: REGISTRATION_GLOBAL_PER_MINUTE
        value: "60"
      - key: DATABASE_POOL_MAX
        value: "5"
